<text x="128" y="209" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Startup preflight gate</text>
<text x="128" y="225" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Refuses to start if the database principal can write (fail-closed)</text>
