<text x="128" y="350" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Quarantine store</text>
<text x="128" y="366" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">PENDING_APPROVAL tickets approved by a human, never by the AI</text>
