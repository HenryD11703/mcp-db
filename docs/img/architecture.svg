<circle cx="104" cy="306" r="12" fill="#0969da"/>
<text x="104" y="310.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="128" y="303" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Cost &amp; limits engine</text>
<text x="128" y="319" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">EXPLAIN-based gating, timeouts, two-tier rate limiting</text>
