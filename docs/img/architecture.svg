<text x="128" y="444" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Data masking engine</text>
<text x="128" y="460" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">IDs, emails, phones and balances masked in memory</text>
