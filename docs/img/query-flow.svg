<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Query decision flow: execute, quarantine for human approval, or block by cost" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Query decision flow: execute, quarantine for human approval, or block by cost</title>
<defs><marker id="a-6e7781" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="a-9a6700" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker><marker id="a-cf222e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="450" y="34" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">What happens to a query</text>
<rect x="30" y="168" width="150" height="64" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="105" y="198" font-size="14" font-weight="600" fill="#0969da" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">query_database</text>
<text x="105" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">agent sends SQL</text>
<line x1="180" y1="200" x2="198" y2="200" stroke="#6e7781" stroke-width="2" marker-end="url(#a-6e7781)"/>
<rect x="200" y="168" width="150" height="64" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="275" y="198" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">AST guard</text>
<text x="275" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">SELECT only?</text>
<line x1="350" y1="200" x2="368" y2="200" stroke="#6e7781" stroke-width="2" marker-end="url(#a-6e7781)"/>
<rect x="370" y="168" width="150" height="64" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="445" y="198" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Cost evaluation</text>
<text x="445" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">EXPLAIN / SHOWPLAN</text>
<polyline points="520,184 560,184 560,90 600,90" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-1a7f37)"/>
<text x="554" y="140" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">low risk</text>
<line x1="520" y1="200" x2="600" y2="200" stroke="#9a6700" stroke-width="2" marker-end="url(#a-9a6700)"/>
<text x="560" y="192" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">moderate</text>
<polyline points="520,216 560,216 560,380 600,380" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#a-cf222e)"/>
<text x="554" y="330" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">critical</text>
<rect x="600" y="60" width="270" height="60" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="735" y="88" font-size="14" font-weight="600" fill="#1a7f37" text-anchor="middle">EXECUTED</text>
<text x="735" y="106" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">masked rows returned</text>
<rect x="600" y="170" width="270" height="60" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="735" y="198" font-size="14" font-weight="600" fill="#9a6700" text-anchor="middle">PENDING_APPROVAL</text>
<text x="735" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">ticket, expires in 15 min</text>
<rect x="600" y="350" width="270" height="60" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="735" y="378" font-size="14" font-weight="600" fill="#cf222e" text-anchor="middle">BLOCKED_BY_COST</text>
<text x="735" y="396" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">cartesian join / huge scan</text>
<line x1="735" y1="230" x2="735" y2="262" stroke="#8250df" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-8250df)"/>
<rect x="600" y="264" width="270" height="64" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="735" y="286" font-size="14" font-weight="600" fill="#8250df" text-anchor="middle">Human operator</text>
<text x="735" y="304" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">db-mcp approve | reject</text>
<text x="735" y="320" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">agent then polls get_query_result</text>
<polyline points="275,232 275,460 600,460" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-cf222e)"/>
<text x="300" y="452" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">mutation, stacked statement or comment</text>
<rect x="600" y="430" width="270" height="60" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="735" y="458" font-size="14" font-weight="600" fill="#cf222e" text-anchor="middle">REJECTED</text>
<text x="735" y="476" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">BLOCKED_BY_GUARD</text>
<text x="30" y="508" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Every outcome is written to the SHA-256 chained audit log.</text>
</svg>
