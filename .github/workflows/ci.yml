name: CI - Adversarial Security & Contract Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Run Adversarial SQL Attack Corpus Gate
        run: npm run test:adversarial

      - name: Run Full Contract & Unit Test Suite
        run: npm test
