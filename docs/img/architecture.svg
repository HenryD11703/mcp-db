<text x="128" y="538" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Zero-trust sanitizer</text>
<text x="128" y="554" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Delimiters and escaping against prompt injection</text>
