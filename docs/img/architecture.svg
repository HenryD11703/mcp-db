<circle cx="104" cy="259" r="12" fill="#0969da"/>
<text x="104" y="263.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="128" y="256" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">AST security guard</text>
<text x="128" y="272" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Single SELECT only: rejects mutations, stacked statements, comments</text>
